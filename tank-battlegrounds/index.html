<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1f2a">
<title>Tank Battlegrounds</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- main menu / game setup -->
<div id="menu" class="screen">
  <div class="card">
    <h1>💥 Tank Battlegrounds</h1>
    <div class="ver" id="ver"></div>
    <div class="opts" id="opts"></div>
    <div class="opt seedrow">
      <div>Map seed (same seed = same map)</div>
      <div class="row"><input id="seed" placeholder="random" maxlength="24" autocomplete="off"><button id="dice" class="step" title="New random seed">🎲</button></div>
    </div>
    <button class="big" id="continueGame" hidden></button>
    <button class="big go" id="start">Start game</button>
    <div class="links"><button class="ic muteBtn" title="Sound"></button><button class="ic fsBtn" title="Fullscreen">⛶ Fullscreen</button><a href="../">← All games</a></div>
  </div>
</div>

<!-- strategy map -->
<div id="mapScreen" hidden>
  <div id="mapMain">
    <div id="mapBar"><div id="players"></div><div id="toast"></div><div id="stock"></div></div>
    <div id="gridWrap"><div id="grid"></div></div>
  </div>
  <div id="mapPanel">
    <div id="cellInfo"></div>
    <div class="row" id="sendRow"><label>Send</label><button class="step" id="sendm">−</button><span class="val" id="sendv"></span><button class="step" id="sendp">+</button></div>
    <button class="big go" id="endTurn">End turn</button>
    <div class="links"><button id="mapMenu">☰ Menu</button><button class="ic muteBtn" title="Sound"></button><button class="ic fsBtn" title="Fullscreen">⛶</button><a href="../">← All games</a></div>
  </div>
</div>

<!-- battle -->
<div id="battle" hidden>
  <canvas id="c"></canvas>
  <div id="panel">
    <div class="row"><label>Angle</label><button class="step" id="angm">↶</button><input type="range" id="ang" min="0" max="180" step="1"><button class="step" id="angp">↷</button><span class="val" id="angv"></span></div>
    <div class="row"><label>Power</label><button class="step" id="powm">−</button><input type="range" id="pow" min="10" max="100" step="1"><button class="step" id="powp">+</button><span class="val" id="powv"></span></div>
    <div class="row" id="wrow"><label>Weapon</label><button class="step" id="wprev">◀</button><div id="wname"></div><button class="step" id="wnext">▶</button></div>
    <div id="wnote"></div>
    <div class="row">
      <button class="step" id="left">◀</button><button class="step" id="right">▶</button>
      <div id="fuel"><div id="fuelbar"></div></div>
      <button id="fire">FIRE</button>
    </div>
    <div class="links"><button id="battleMenu">☰ Menu</button><button class="ic muteBtn" title="Sound"></button><button class="ic fsBtn" title="Fullscreen">⛶</button></div>
  </div>
  <div id="end" class="screen" hidden>
    <div class="card">
      <h2 id="msg"></h2>
      <button class="big go" id="continue">Continue</button>
    </div>
  </div>
</div>

<!-- attack confirmation -->
<div id="dialog" class="screen dim" hidden>
  <div class="card">
    <h2 id="dlgTitle"></h2>
    <p id="dlgText"></p>
    <div id="dlgBtns"></div>
  </div>
</div>

<!-- game over -->
<div id="over" class="screen dim" hidden>
  <div class="card">
    <h2 id="overMsg"></h2>
    <button class="big go" id="overAgain">Play this map again</button>
    <button class="big" id="overMenu">Menu</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
